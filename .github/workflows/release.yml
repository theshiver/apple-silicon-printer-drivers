name: Build & attest installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install gettext pkgconf cmake

      - name: Build Gutenprint (arm64) from source
        run: |
          set -e
          uname -m
          rm -rf pkgroot/Library/Printers/Gutenprint/libexec pkgroot/Library/Printers/Gutenprint/share
          build/build-gutenprint.sh
          file pkgroot/Library/Printers/Gutenprint/libexec/rastertogutenprint.5.3

      - name: Build brlaser (arm64) from source
        run: build/build-brlaser.sh

      - name: Test printer setup and Brother filter chain
        run: |
          python3 -m unittest discover -s tests -v
          build/test-brlaser.sh

      - name: Smoke test — generated PPD must pass through the real filter chain
        run: |
          set -e
          GP=$PWD/pkgroot/Library/Printers/Gutenprint
          T=$(mktemp -d)
          for M in bjc-MP250-series escp2-r300 hp-lj_1010; do
            STP_DATA_PATH=$GP/share/gutenprint/5.3/xml "$GP/libexec/cups-genppd.5.3" -p "$T" "$M" >/dev/null
          done
          for Z in "$T"/*.ppd.gz; do
            P="${Z%.gz}"; gunzip -c "$Z" | perl -pe 's#(\*cupsFilter:\s*"application/vnd\.cups-raster \d+ )rastertogutenprint\.5\.3"#$1'"$GP"'/libexec/rastertogutenprint.5.3"#' > "$P"
            echo "smoke test" | /usr/libexec/cups/filter/cgtexttopdf 1 u t 1 "" > "$T/t.pdf" 2>/dev/null
            PPD="$P" /usr/libexec/cups/filter/cgpdftoraster 1 u t 1 "" "$T/t.pdf" > "$T/t.ras" 2>/dev/null
            OUT=$(STP_DATA_PATH=$GP/share/gutenprint/5.3/xml PPD="$P" "$GP/libexec/rastertogutenprint.5.3" 1 u t 1 "" "$T/t.ras" 2>"$T/err" | wc -c)
            grep -i 'corrupt\|ERROR' "$T/err" && exit 1
            [ "$OUT" -gt 1000 ] || { echo "no output for $P"; exit 1; }
            echo "OK $(basename "$P"): $OUT bytes"
          done

      - name: Build .pkg
        run: |
          VER=${GITHUB_REF_NAME#v}; [ "$VER" = "$GITHUB_REF_NAME" ] && VER=0.0.0-ci
          build/make-pkg.sh "$VER"
          cd dist && shasum -a 256 *.pkg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.pkg

      - name: Upload artifacts (CI runs)
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notarized package is built locally with Developer ID certs and attached first;
          # CI only fills in when a tag has no package yet (and always refreshes checksums of its own build as ci-*)
          if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -q '\.pkg$'; then
            for f in dist/*; do cp "$f" "dist/ci-$(basename "$f")"; done
            gh release upload "$GITHUB_REF_NAME" dist/ci-* --clobber
          else
            gh release upload "$GITHUB_REF_NAME" dist/*.pkg dist/SHA256SUMS.txt --clobber
          fi
