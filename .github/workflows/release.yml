name: Build & attest installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install gettext pkgconf

      - name: Build Gutenprint (arm64) from source
        run: |
          set -e
          uname -m
          rm -rf pkgroot/Library/Printers/Gutenprint/libexec pkgroot/Library/Printers/Gutenprint/share
          build/build-gutenprint.sh
          file pkgroot/Library/Printers/Gutenprint/libexec/rastertogutenprint.5.3

      - name: Build .pkg
        run: |
          VER=${GITHUB_REF_NAME#v}; [ "$VER" = "$GITHUB_REF_NAME" ] && VER=0.0.0-ci
          build/make-pkg.sh "$VER"
          cd dist && shasum -a 256 *.pkg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.pkg

      - name: Upload artifacts (CI runs)
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.pkg dist/SHA256SUMS.txt --clobber
